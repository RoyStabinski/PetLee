<?xml version="1.0" encoding="UTF-8"?>
<ui:composition template="/WEB-INF/templates/main.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="jakarta.faces.passthrough">

    <f:metadata>
        <f:viewAction action="#{userBean.redirectHome}" if="#{userBean.loggedIn}"/>
    </f:metadata>

    <ui:define name="title">Create an account - Pet-Lee</ui:define>

    <ui:define name="head">
        <script src="#{request.contextPath}/resources/js/avatar.js?v=#{initParam['petlee.ASSET_VERSION']}"
                defer="defer"></script>
    </ui:define>

    <ui:define name="content">

        <div class="auth-card">
            <ui:include src="/WEB-INF/includes/authPanel.xhtml"/>

            <div class="auth-form">
                <h1>Create an account</h1>

                <!-- Multipart for the photo: enctype is not optional for h:inputFile. -->
                <h:form id="registerForm" enctype="multipart/form-data">

                    <!-- The optional photo. The round tile is the file input's label; avatar.js
                         previews the chosen file in it. Without JavaScript the upload still
                         works, the tile just keeps its silhouette. -->
                    <div class="avatar-picker" data-avatar-picker="">
                        <h:outputLabel for="avatarFile" styleClass="avatar-picker-label">
                            <span class="avatar-picker-frame">
                                <span class="avatar-picker-placeholder" data-avatar-placeholder="">
                                    <svg viewBox="0 0 24 24" width="48" height="48" fill="currentColor"
                                         aria-hidden="true" focusable="false">
                                        <circle cx="12" cy="8.5" r="4.5"/>
                                        <path d="M3 22c.8-4.6 4.4-7.5 9-7.5s8.2 2.9 9 7.5z"/>
                                    </svg>
                                </span>
                                <img class="avatar-picker-img" data-avatar-img="" alt="" width="96" height="96"
                                     hidden="hidden"/>
                                <span class="avatar-picker-badge" aria-hidden="true">+</span>
                            </span>
                            <span class="avatar-picker-caption" data-avatar-caption="">Add photo</span>
                            <h:inputFile id="avatarFile" value="#{userBean.avatarFile}"
                                         accept="image/jpeg,image/png,image/gif,image/webp"
                                         styleClass="upload-input"/>
                        </h:outputLabel>
                        <span class="field-hint">Optional. JPEG, PNG, GIF or WebP, up to 5 MB.</span>
                    </div>

                    <!-- Two fields a row: full name and username, email and telephone, the two
                         passwords, then region across the row. -->
                    <div class="form-grid form-grid-2">

                        <div class="field">
                            <h:outputLabel for="fullName" value="Full name"/>
                            <h:inputText id="fullName" value="#{userBean.fullName}" required="true"
                                         requiredMessage="Required" autocomplete="name"
                                         validatorMessage="A full name is at most 50 characters.">
                                <f:validateLength maximum="50"/>
                            </h:inputText>
                            <h:message for="fullName" styleClass="field-error"/>
                        </div>

                        <div class="field">
                            <h:outputLabel for="username" value="Username"/>
                            <h:inputText id="username" value="#{userBean.username}" required="true"
                                         requiredMessage="Required" autocomplete="username"
                                         validatorMessage="A username is 3 to 20 characters: letters, digits and underscore.">
                                <f:validateRegex pattern="^[A-Za-z0-9_]{3,20}$"/>
                            </h:inputText>
                            <h:message for="username" styleClass="field-error"/>
                        </div>

                        <div class="field">
                            <h:outputLabel for="email" value="Email"/>
                            <h:inputText id="email" value="#{userBean.email}" type="email" required="true"
                                         requiredMessage="Required" autocomplete="email"
                                         validatorMessage="Enter a valid email address of at most 100 characters.">
                                <f:validateLength maximum="100"/>
                                <f:validateRegex pattern="^[^@\s]+@[^@\s]+$"/>
                            </h:inputText>
                            <h:message for="email" styleClass="field-error"/>
                        </div>

                        <div class="field">
                            <h:outputLabel for="phone" value="Telephone"/>
                            <!-- The regex mirrors com.petlee.util.PhoneNumbers, which decides. -->
                            <h:inputText id="phone" value="#{userBean.phone}" type="tel" maxlength="20"
                                         p:placeholder="050-1234567" autocomplete="tel"
                                         validatorMessage="Enter a valid Israeli phone number, for example 050-1234567">
                                <f:validateLength maximum="20"/>
                                <f:validateRegex pattern="^(?:\s*|[\s()-]*(?:\+[\s()-]*9[\s()-]*7[\s()-]*2|9[\s()-]*7[\s()-]*2|0)[\s()-]*(?:[57](?:[\s()-]*\d){8}|[23489](?:[\s()-]*\d){7})[\s()-]*)$"/>
                            </h:inputText>
                            <h:message for="phone" styleClass="field-error"/>
                            <span class="field-hint">Optional. A mobile (05X) or landline number, for example 050-1234567 or 02-1234567</span>
                        </div>

                        <div class="field">
                            <h:outputLabel for="password" value="Password"/>
                            <h:inputSecret id="password" value="#{userBean.password}" required="true"
                                           requiredMessage="Required" redisplay="false"
                                           autocomplete="new-password"
                                           validatorMessage="A password is at least 8 characters.">
                                <f:validateLength minimum="8"/>
                            </h:inputSecret>
                            <h:message for="password" styleClass="field-error"/>
                        </div>

                        <div class="field">
                            <h:outputLabel for="confirmPassword" value="Confirm password"/>
                            <h:inputSecret id="confirmPassword" value="#{userBean.confirmPassword}"
                                           required="true" requiredMessage="Required"
                                           redisplay="false" autocomplete="new-password"/>
                            <h:message for="confirmPassword" styleClass="field-error"/>
                        </div>

                        <div class="field field-wide">
                            <h:outputLabel for="region" value="Region"/>
                            <h:inputText id="region" value="#{userBean.region}"
                                         autocomplete="address-level1"
                                         validatorMessage="A region is at most 100 characters.">
                                <f:validateLength maximum="100"/>
                            </h:inputText>
                            <h:message for="region" styleClass="field-error"/>
                        </div>

                    </div>

                    <div class="actions">
                        <h:commandButton id="submit" value="Create account" action="#{userBean.register}"
                                         styleClass="button-block"/>
                    </div>
                </h:form>

                <p class="auth-switch">
                    Already registered?
                    <h:outputLink value="#{request.contextPath}/login.xhtml">Log in</h:outputLink>
                </p>
            </div>
        </div>

        <ui:include src="/WEB-INF/includes/authScene.xhtml"/>

    </ui:define>

</ui:composition>
