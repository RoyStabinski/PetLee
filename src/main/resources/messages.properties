# Pet-Lee user-facing text.
#
# Every string a user can read lives here, reached from XHTML as #{msg.key} - T-25 requirement 6.
# The rule is not tidiness: a Hebrew or Arabic translation is a second properties file when the
# text is here, and a rewrite of every page when it is not.
#
# Keys are namespaced by area (app, nav, gallery, pet, form, auth, error) so a page's strings can
# be found without reading the page. ISO-8859-1 is the properties default; non-ASCII text belongs
# in a messages_<locale>.properties written in UTF-8 with a Java 9+ loader, not escaped here.

