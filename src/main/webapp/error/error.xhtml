<?xml version="1.0" encoding="UTF-8"?>
<!--
    The general error page - covers 403, 500 and a expired view (ViewExpiredException) alike.

    One page and deliberately generic wording, rather than three near-identical pages each naming
    its own status: none of the three benefit from a user being told which HTTP code fired, and a
    single page is one less place for the same sentence to drift.
-->
<ui:composition template="/WEB-INF/templates/main.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets">

    <ui:define name="title">Something went wrong - Pet-Lee</ui:define>

    <ui:define name="content">
        <div class="panel panel-narrow">
            <h1>Something went wrong</h1>
            <p>We could not complete that request. Please try again.</p>

            <!--
                What is deliberately not here: the exception, its class, its message, its stack
                trace, and the SQL underneath it. Not even in Development stage - the project stage
                is a configuration value, and the one time it is wrong is the one time it matters.

                A correlation id is shown when the request carries one, so a user can quote it and
                somebody can find the matching line in the server log. T-19 sets it on the REST
                tier's error responses; a failure that never reached the API has none, and the
                block simply does not render.
            -->
            <ui:fragment rendered="#{not empty requestScope['petlee.correlationId']}">
                <p class="field-hint">
                    Reference: #{requestScope['petlee.correlationId']}
                </p>
            </ui:fragment>

            <div class="actions">
                <h:outputLink value="#{request.contextPath}/index.xhtml" styleClass="button">
                    Back to the gallery
                </h:outputLink>
            </div>
        </div>
    </ui:define>

</ui:composition>
