<?xml version="1.0" encoding="UTF-8"?>
<ui:composition template="/WEB-INF/templates/main.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets">

    <f:metadata>
        <f:viewAction action="#{petFormBean.loadCategories}"/>
    </f:metadata>

    <ui:define name="title">Add a pet - Pet-Lee</ui:define>

    <ui:define name="content">
        <div class="panel">
            <h1>Publish a new adoption listing</h1>
            <!-- multipart: Mojarra's h:inputFile decodes with request.getParts(). -->
            <h:form id="petForm" enctype="multipart/form-data">
                <ui:include src="/WEB-INF/includes/petFields.xhtml"/>

                <fieldset class="form-section">
                    <legend>Photos</legend>
                    <div class="field">
                        <h:outputLabel for="photo" value="Choose photographs"/>
                        <h:inputFile id="photo" value="#{petFormBean.uploadedFiles}" accept="image/*"
                                     multiple="true"/>
                        <h:message for="photo" styleClass="field-error"/>
                        <p class="field-hint">#{petFormBean.uploadLimits}</p>
                    </div>
                </fieldset>

                <div class="actions">
                    <h:outputLink value="#{request.contextPath}/profile.xhtml"
                                  styleClass="button-secondary">Cancel</h:outputLink>
                    <h:commandButton id="save" value="Publish" action="#{petFormBean.save}"/>
                </div>
            </h:form>
        </div>
    </ui:define>

</ui:composition>
