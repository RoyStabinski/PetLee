<?xml version="1.0" encoding="UTF-8"?>
<!--
    Placeholder landing page, now written inside T-25's template. T-29 replaces the content region
    with the gallery and its filter panel.

    It is deliberately nothing but a <ui:composition> filling two regions - which is what T-25
    criterion 1 asks to see: a page with no header, no footer and no stylesheet link of its own
    that nevertheless renders the whole frame.
-->
<ui:composition template="/WEB-INF/templates/main.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets">

    <ui:define name="title">#{msg['gallery.title']} - #{msg['app.name']}</ui:define>

    <ui:define name="content">
        <h1>#{msg['gallery.title']}</h1>

        <div class="empty-state">
            <p>#{msg['gallery.empty']}</p>
        </div>
    </ui:define>

</ui:composition>
