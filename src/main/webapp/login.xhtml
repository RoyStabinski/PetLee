<?xml version="1.0" encoding="UTF-8"?>
<ui:composition template="/WEB-INF/templates/main.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets">

    <f:metadata>
        <f:viewAction action="#{userBean.redirectHome}" if="#{userBean.loggedIn}"/>
    </f:metadata>

    <ui:define name="title">Log in - Pet-Lee</ui:define>

    <ui:define name="content">

        <div class="panel panel-narrow">
            <h1>Log in</h1>

            <h:form id="loginForm">

                <div class="field">
                    <h:outputLabel for="username" value="Username"/>
                    <h:inputText id="username"
                                 value="#{userBean.username}"
                                 required="true"
                                 requiredMessage="Required"
                                 autocomplete="username"/>
                    <h:message for="username" styleClass="field-error"/>
                </div>

                <div class="field">
                    <h:outputLabel for="password" value="Password"/>
                    <h:inputSecret id="password"
                                   value="#{userBean.password}"
                                   required="true"
                                   requiredMessage="Required"
                                   redisplay="false"
                                   autocomplete="current-password"/>
                    <h:message for="password" styleClass="field-error"/>
                </div>

                <div class="actions">
                    <h:commandButton id="submit" value="Log in" action="#{userBean.login}"/>
                </div>

            </h:form>

            <p>
                No account yet?
                <h:outputLink value="#{request.contextPath}/register.xhtml">Register</h:outputLink>
            </p>
        </div>

    </ui:define>

</ui:composition>
